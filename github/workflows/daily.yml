name: Kalshi daily snapshot

on:
  schedule:
    - cron: "0 15 * * *"   # daily, 10am CDT / 9am CST
  workflow_dispatch:        # manual run from the GitHub app

permissions:
  contents: write

concurrency:
  group: kalshi-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Scrape Kalshi NFL markets
        run: python kalshi_history.py
        env:
          NFL_WEEK1_TUESDAY: "2026-09-08"

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898693+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Kalshi snapshot $(date -u +%F)"
            git push
          fi
